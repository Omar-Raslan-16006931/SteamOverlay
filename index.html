<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Steam Price Overlay</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: rgba(14, 17, 22, 0.97);
      --panel: #171c24;
      --border: #2b3442;
      --input: #0f141b;
      --text: #eef2f7;
      --muted: #96a3b5;
      --accent: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: var(--text);
    }

    body {
      padding: 10px;
    }

    #app {
      width: 100%;
      height: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #titlebar {
      -webkit-app-region: drag;
      height: 38px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      flex-shrink: 0;
    }

    #titleleft {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      font-size: 12px;
      font-weight: 700;
      color: #d8e1ea;
    }

    #dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px rgba(34,197,94,0.6);
    }

    #windowBtns {
      -webkit-app-region: no-drag;
      display: flex;
      gap: 6px;
    }

    .winBtn {
      width: 24px;
      height: 20px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
    }

    .winBtn:hover {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    #body {
      -webkit-app-region: no-drag;
      flex: 1;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
    }

    input, select, button {
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      outline: none;
      font-size: 13px;
    }

    input, select {
      width: 100%;
      background: var(--input);
      color: var(--text);
      padding: 0 10px;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    }

    #rateRow {
      display: grid;
      grid-template-columns: 1fr 110px;
      gap: 8px;
      align-items: end;
    }

    button {
      background: rgba(255,255,255,0.06);
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background: rgba(255,255,255,0.11);
    }

    #refreshBtn {
      background: rgba(59,130,246,0.12);
      border-color: rgba(59,130,246,0.28);
      color: #bfdbfe;
    }

    #lockBtn.locked {
      background: rgba(239,68,68,0.12);
      border-color: rgba(239,68,68,0.32);
      color: #fecaca;
    }

    #status {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      line-height: 1.3;
      padding-top: 2px;
    }

    #body::-webkit-scrollbar {
      width: 5px;
    }

    #body::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="titlebar">
      <div id="titleleft">
        <div id="dot"></div>
        <div>Steam Price Overlay</div>
      </div>
      <div id="windowBtns">
        <button class="winBtn" id="minBtn">—</button>
        <button class="winBtn" id="closeBtn">✕</button>
      </div>
    </div>

    <div id="body">
      <div class="grid2">
        <div class="field">
          <label for="fromCur">From currency</label>
          <select id="fromCur"></select>
        </div>
        <div class="field">
          <label for="toCur">To currency</label>
          <select id="toCur"></select>
        </div>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="fromAmt">From amount</label>
          <input id="fromAmt" type="number" step="0.01" placeholder="Enter amount" />
        </div>
        <div class="field">
          <label for="toAmt">To amount</label>
          <input id="toAmt" type="number" step="0.01" placeholder="Enter amount" />
        </div>
      </div>

      <div id="rateRow">
        <div class="field">
          <label for="rate">Rate</label>
          <input id="rate" type="number" step="0.00001" placeholder="Live rate" />
        </div>
        <button id="refreshBtn">Refresh</button>
      </div>

      <button id="swapBtn">Swap currencies</button>
      <button id="lockBtn">Lock overlay</button>
      <p id="status">Loading latest currencies and rates...</p>
    </div>
  </div>

  <script>
    const CURRENCY_NAMES = {
      AED: 'UAE Dirham', AFN: 'Afghan Afghani', ALL: 'Albanian Lek', AMD: 'Armenian Dram',
      ANG: 'Netherlands Antillean Guilder', AOA: 'Angolan Kwanza', ARS: 'Argentine Peso', AUD: 'Australian Dollar',
      AWG: 'Aruban Florin', AZN: 'Azerbaijani Manat', BAM: 'Bosnia-Herzegovina Mark', BBD: 'Barbadian Dollar',
      BDT: 'Bangladeshi Taka', BGN: 'Bulgarian Lev', BHD: 'Bahraini Dinar', BIF: 'Burundian Franc',
      BMD: 'Bermudan Dollar', BND: 'Brunei Dollar', BOB: 'Bolivian Boliviano', BRL: 'Brazilian Real',
      BSD: 'Bahamian Dollar', BTN: 'Bhutanese Ngultrum', BWP: 'Botswana Pula', BYN: 'Belarusian Ruble',
      BZD: 'Belize Dollar', CAD: 'Canadian Dollar', CDF: 'Congolese Franc', CHF: 'Swiss Franc',
      CLP: 'Chilean Peso', CNY: 'Chinese Yuan', COP: 'Colombian Peso', CRC: 'Costa Rican Colon',
      CUP: 'Cuban Peso', CVE: 'Cape Verdean Escudo', CZK: 'Czech Koruna', DJF: 'Djiboutian Franc',
      DKK: 'Danish Krone', DOP: 'Dominican Peso', DZD: 'Algerian Dinar', EGP: 'Egyptian Pound',
      ERN: 'Eritrean Nakfa', ETB: 'Ethiopian Birr', EUR: 'Euro', FJD: 'Fijian Dollar',
      FKP: 'Falkland Islands Pound', GBP: 'British Pound', GEL: 'Georgian Lari', GHS: 'Ghanaian Cedi',
      GIP: 'Gibraltar Pound', GMD: 'Gambian Dalasi', GNF: 'Guinean Franc', GTQ: 'Guatemalan Quetzal',
      GYD: 'Guyanese Dollar', HKD: 'Hong Kong Dollar', HNL: 'Honduran Lempira', HTG: 'Haitian Gourde',
      HUF: 'Hungarian Forint', IDR: 'Indonesian Rupiah', ILS: 'Israeli New Shekel', INR: 'Indian Rupee',
      IQD: 'Iraqi Dinar', IRR: 'Iranian Rial', ISK: 'Icelandic Krona', JMD: 'Jamaican Dollar',
      JOD: 'Jordanian Dinar', JPY: 'Japanese Yen', KES: 'Kenyan Shilling', KGS: 'Kyrgyzstani Som',
      KHR: 'Cambodian Riel', KMF: 'Comorian Franc', KRW: 'South Korean Won', KWD: 'Kuwaiti Dinar',
      KZT: 'Kazakhstani Tenge', LAK: 'Lao Kip', LBP: 'Lebanese Pound', LKR: 'Sri Lankan Rupee',
      LRD: 'Liberian Dollar', LSL: 'Lesotho Loti', LYD: 'Libyan Dinar', MAD: 'Moroccan Dirham',
      MDL: 'Moldovan Leu', MGA: 'Malagasy Ariary', MKD: 'Macedonian Denar', MMK: 'Myanmar Kyat',
      MNT: 'Mongolian Tugrik', MOP: 'Macanese Pataca', MRU: 'Mauritanian Ouguiya', MUR: 'Mauritian Rupee',
      MVR: 'Maldivian Rufiyaa', MWK: 'Malawian Kwacha', MXN: 'Mexican Peso', MYR: 'Malaysian Ringgit',
      MZN: 'Mozambican Metical', NAD: 'Namibian Dollar', NGN: 'Nigerian Naira', NIO: 'Nicaraguan Cordoba',
      NOK: 'Norwegian Krone', NPR: 'Nepalese Rupee', NZD: 'New Zealand Dollar', OMR: 'Omani Rial',
      PAB: 'Panamanian Balboa', PEN: 'Peruvian Sol', PHP: 'Philippine Peso', PKR: 'Pakistani Rupee',
      PLN: 'Polish Zloty', PYG: 'Paraguayan Guarani', QAR: 'Qatari Riyal', RON: 'Romanian Leu',
      RSD: 'Serbian Dinar', RUB: 'Russian Ruble', RWF: 'Rwandan Franc', SAR: 'Saudi Riyal',
      SBD: 'Solomon Islands Dollar', SCR: 'Seychellois Rupee', SDG: 'Sudanese Pound', SEK: 'Swedish Krona',
      SGD: 'Singapore Dollar', SLE: 'Sierra Leonean Leone', SOS: 'Somali Shilling', SRD: 'Surinamese Dollar',
      SSP: 'South Sudanese Pound', STN: 'Sao Tome and Principe Dobra', SYP: 'Syrian Pound', SZL: 'Eswatini Lilangeni',
      THB: 'Thai Baht', TJS: 'Tajikistani Somoni', TMT: 'Turkmen Manat', TND: 'Tunisian Dinar',
      TOP: 'Tongan Paanga', TRY: 'Turkish Lira', TTD: 'Trinidad and Tobago Dollar', TWD: 'New Taiwan Dollar',
      TZS: 'Tanzanian Shilling', UAH: 'Ukrainian Hryvnia', UGX: 'Ugandan Shilling', USD: 'US Dollar',
      UYU: 'Uruguayan Peso', UZS: 'Uzbekistani Som', VES: 'Venezuelan Bolivar', VND: 'Vietnamese Dong',
      XAF: 'Central African CFA Franc', XCD: 'East Caribbean Dollar', XOF: 'West African CFA Franc',
      XPF: 'CFP Franc', YER: 'Yemeni Rial', ZAR: 'South African Rand', ZMW: 'Zambian Kwacha'
    };

    const fromCurEl = document.getElementById('fromCur');
    const toCurEl = document.getElementById('toCur');
    const fromAmtEl = document.getElementById('fromAmt');
    const toAmtEl = document.getElementById('toAmt');
    const rateEl = document.getElementById('rate');
    const refreshBtn = document.getElementById('refreshBtn');
    const swapBtn = document.getElementById('swapBtn');
    const lockBtn = document.getElementById('lockBtn');
    const statusEl = document.getElementById('status');
    const minBtn = document.getElementById('minBtn');
    const closeBtn = document.getElementById('closeBtn');

    let lastEdited = 'from';
    let currentRates = {};
    let currentBase = 'UAH';

    function labelFor(code) {
      return `${code} - ${CURRENCY_NAMES[code] || code}`;
    }

    async function fetchRates(base) {
      const res = await fetch(`https://open.er-api.com/v6/latest/${base}`);
      const data = await res.json();
      if (!data || data.result !== 'success' || !data.rates) {
        throw new Error('Could not load rates');
      }
      return data;
    }

    function populateCurrencies(codes) {
      const currentFrom = fromCurEl.value || 'UAH';
      const currentTo = toCurEl.value || 'SAR';
      fromCurEl.innerHTML = '';
      toCurEl.innerHTML = '';

      codes.sort().forEach(code => {
        fromCurEl.add(new Option(labelFor(code), code));
        toCurEl.add(new Option(labelFor(code), code));
      });

      fromCurEl.value = codes.includes(currentFrom) ? currentFrom : 'UAH';
      toCurEl.value = codes.includes(currentTo) ? currentTo : 'SAR';

      if (fromCurEl.value === toCurEl.value && codes.length > 1) {
        toCurEl.value = fromCurEl.value === 'SAR' ? 'USD' : 'SAR';
      }
    }

    function recalc() {
      const rate = parseFloat(rateEl.value || '0');
      if (!rate) {
        if (lastEdited === 'from') toAmtEl.value = '';
        else fromAmtEl.value = '';
        return;
      }

      if (lastEdited === 'from') {
        const fromAmt = parseFloat(fromAmtEl.value || '0');
        toAmtEl.value = fromAmt ? (fromAmt * rate).toFixed(2) : '';
      } else {
        const toAmt = parseFloat(toAmtEl.value || '0');
        fromAmtEl.value = toAmt ? (toAmt / rate).toFixed(2) : '';
      }
    }

    function updateRateFromCache() {
      const from = fromCurEl.value;
      const to = toCurEl.value;
      if (!from || !to || from !== currentBase) return;
      rateEl.value = from === to ? '1' : (currentRates[to] ? Number(currentRates[to]).toFixed(5) : '');
      recalc();
    }

    async function loadBaseRates(base, showText = true) {
      if (showText) statusEl.textContent = `Fetching latest ${base} rates...`;
      const data = await fetchRates(base);
      currentBase = data.base_code || base;
      currentRates = data.rates || {};
      const codes = Object.keys(currentRates);
      if (!codes.includes(currentBase)) codes.push(currentBase);
      populateCurrencies(codes);
      updateRateFromCache();
      statusEl.textContent = `Latest rates loaded for ${currentBase}.`;
    }

    async function ensureBaseMatchesFrom() {
      if (fromCurEl.value === currentBase) {
        updateRateFromCache();
        return;
      }
      try {
        await loadBaseRates(fromCurEl.value);
      } catch {
        statusEl.textContent = 'Could not refresh rates for selected base currency.';
      }
    }

    fromAmtEl.addEventListener('input', () => {
      lastEdited = 'from';
      recalc();
    });

    toAmtEl.addEventListener('input', () => {
      lastEdited = 'to';
      recalc();
    });

    rateEl.addEventListener('input', recalc);
    fromCurEl.addEventListener('change', ensureBaseMatchesFrom);
    toCurEl.addEventListener('change', updateRateFromCache);

    swapBtn.addEventListener('click', async () => {
      const oldFromCur = fromCurEl.value;
      const oldToCur = toCurEl.value;
      const oldFromAmt = fromAmtEl.value;
      const oldToAmt = toAmtEl.value;

      fromCurEl.value = oldToCur;
      toCurEl.value = oldFromCur;
      fromAmtEl.value = oldToAmt;
      toAmtEl.value = oldFromAmt;
      lastEdited = 'from';

      await ensureBaseMatchesFrom();
    });

    refreshBtn.addEventListener('click', async () => {
      try {
        await loadBaseRates(fromCurEl.value);
      } catch {
        statusEl.textContent = 'Could not refresh live rates.';
      }
    });

    lockBtn.addEventListener('click', async () => {
      const locked = await window.api.toggleLock();
      lockBtn.textContent = locked ? 'Unlock overlay' : 'Lock overlay';
      lockBtn.className = locked ? 'locked' : '';
      statusEl.textContent = locked ? 'Overlay locked. Ctrl+Shift+L to unlock.' : 'Overlay unlocked. Drag top bar to move.';
    });

    minBtn.addEventListener('click', () => window.api.minimize());
    closeBtn.addEventListener('click', () => window.api.close());

    window.api.onLock((locked) => {
      lockBtn.textContent = locked ? 'Unlock overlay' : 'Lock overlay';
      lockBtn.className = locked ? 'locked' : '';
    });

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        await loadBaseRates('UAH', false);
        const locked = await window.api.getLock();
        lockBtn.textContent = locked ? 'Unlock overlay' : 'Lock overlay';
        lockBtn.className = locked ? 'locked' : '';
      } catch {
        statusEl.textContent = 'Startup rate fetch failed. Check internet and reopen app.';
      }
    });
  </script>
</body>
</html>
