<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Steam Price Overlay</title>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:     rgba(14,17,22,0.97);
    --panel:  #171c24;
    --border: #2b3442;
    --input:  #0f141b;
    --text:   #eef2f7;
    --muted:  #96a3b5;
    --accent: #3b82f6;
    --green:  #22c55e;
    --red:    #ef4444;
  }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: var(--text);
    /* CRITICAL — body must never be a drag region */
    -webkit-app-region: no-drag;
  }

  /* Use inset instead of padding so no transparent area steals clicks */
  #app {
    position: absolute;
    inset: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-app-region: no-drag;
  }

  #titlebar {
    -webkit-app-region: drag;
    height: 38px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; flex-shrink: 0; user-select: none;
  }
  #titleleft {
    display: flex; align-items: center; gap: 8px;
    pointer-events: none;
    font-size: 12px; font-weight: 700; color: #d8e1ea;
  }
  #dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 6px rgba(34,197,94,.6);
    transition: background .3s, box-shadow .3s;
  }
  #dot.scanning { background: #f59e0b; box-shadow: 0 0 6px rgba(245,158,11,.7); }
  #dot.error    { background: var(--red); box-shadow: 0 0 6px rgba(239,68,68,.7); }

  #windowBtns { -webkit-app-region: no-drag; display: flex; gap: 6px; }
  .winBtn {
    -webkit-app-region: no-drag;
    width: 24px; height: 20px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.06); color: var(--muted);
    border-radius: 5px; cursor: pointer; font-size: 11px;
  }
  .winBtn:hover { background: rgba(255,255,255,.14); color: #fff; }

  #body {
    -webkit-app-region: no-drag;
    flex: 1; padding: 10px;
    display: flex; flex-direction: column; gap: 8px;
    overflow-y: auto; overflow-x: hidden;
  }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; font-weight: 700;
    user-select: none;
  }

  input, select, button {
    -webkit-app-region: no-drag;
    height: 36px; border-radius: 8px;
    border: 1px solid var(--border); outline: none; font-size: 13px;
  }
  input, select {
    width: 100%; background: var(--input);
    color: var(--text); padding: 0 10px;
  }
  select { cursor: pointer; }
  input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59,130,246,.12);
  }
  button {
    background: rgba(255,255,255,.06); color: white;
    cursor: pointer; font-weight: 600; width: 100%;
    pointer-events: auto;
  }
  button:hover  { background: rgba(255,255,255,.14); }
  button:active { background: rgba(255,255,255,.22); }

  #rateRow { display: grid; grid-template-columns: 1fr 90px; gap: 8px; align-items: end; }

  #refreshBtn { background:rgba(59,130,246,.12); border-color:rgba(59,130,246,.3); color:#bfdbfe; }
  #refreshBtn:hover { background:rgba(59,130,246,.22); }

  #scanBtn { background:rgba(34,197,94,.12); border-color:rgba(34,197,94,.3); color:#86efac; }
  #scanBtn:hover { background:rgba(34,197,94,.22); }
  #scanBtn.active { background:rgba(239,68,68,.13); border-color:rgba(239,68,68,.35); color:#fca5a5; }
  #scanBtn.active:hover { background:rgba(239,68,68,.23); }

  #lockBtn.locked { background:rgba(239,68,68,.13); border-color:rgba(239,68,68,.35); color:#fecaca; }

  .divider { border: none; border-top: 1px solid var(--border); margin: 2px 0; }
  #status { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.5; min-height: 16px; }

  #body::-webkit-scrollbar { width: 5px; }
  #body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div id="titleleft">
      <div id="dot"></div>
      <span>Steam Price Overlay</span>
    </div>
    <div id="windowBtns">
      <button class="winBtn" id="minBtn">—</button>
      <button class="winBtn" id="closeBtn">✕</button>
    </div>
  </div>

  <div id="body">
    <div class="grid2">
      <div class="field"><label>From</label><select id="fromCur"></select></div>
      <div class="field"><label>To</label><select id="toCur"></select></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Amount</label><input id="fromAmt" type="number" step="0.01" placeholder="Enter amount"/></div>
      <div class="field"><label>Converted</label><input id="toAmt" type="number" step="0.01" placeholder="Result"/></div>
    </div>
    <div id="rateRow">
      <div class="field"><label>Exchange rate</label><input id="rate" type="number" step="0.000001" placeholder="Live rate"/></div>
      <button id="refreshBtn">Refresh</button>
    </div>
    <button id="swapBtn">⇅ Swap currencies</button>
    <hr class="divider"/>
    <div class="field"><label>OCR source</label><select id="sourceSelect"></select></div>
    <div class="grid2">
      <button id="refreshSources">↻ Sources</button>
      <button id="scanBtn">▶ Start scan</button>
    </div>
    <hr class="divider"/>
    <button id="lockBtn">🔓 Lock overlay</button>
    <p id="status">Loading rates…</p>
  </div>
</div>

<script>
const CURRENCY_NAMES={AED:'UAE Dirham',AFN:'Afghan Afghani',ALL:'Albanian Lek',AMD:'Armenian Dram',ANG:'Netherlands Antillean Guilder',AOA:'Angolan Kwanza',ARS:'Argentine Peso',AUD:'Australian Dollar',AWG:'Aruban Florin',AZN:'Azerbaijani Manat',BAM:'Bosnia-Herzegovina Mark',BBD:'Barbadian Dollar',BDT:'Bangladeshi Taka',BGN:'Bulgarian Lev',BHD:'Bahraini Dinar',BIF:'Burundian Franc',BMD:'Bermudan Dollar',BND:'Brunei Dollar',BOB:'Bolivian Boliviano',BRL:'Brazilian Real',BSD:'Bahamian Dollar',BTN:'Bhutanese Ngultrum',BWP:'Botswana Pula',BYN:'Belarusian Ruble',BZD:'Belize Dollar',CAD:'Canadian Dollar',CDF:'Congolese Franc',CHF:'Swiss Franc',CLP:'Chilean Peso',CNY:'Chinese Yuan',COP:'Colombian Peso',CRC:'Costa Rican Colon',CUP:'Cuban Peso',CVE:'Cape Verdean Escudo',CZK:'Czech Koruna',DJF:'Djiboutian Franc',DKK:'Danish Krone',DOP:'Dominican Peso',DZD:'Algerian Dinar',EGP:'Egyptian Pound',ERN:'Eritrean Nakfa',ETB:'Ethiopian Birr',EUR:'Euro',FJD:'Fijian Dollar',FKP:'Falkland Islands Pound',GBP:'British Pound',GEL:'Georgian Lari',GHS:'Ghanaian Cedi',GIP:'Gibraltar Pound',GMD:'Gambian Dalasi',GNF:'Guinean Franc',GTQ:'Guatemalan Quetzal',GYD:'Guyanese Dollar',HKD:'Hong Kong Dollar',HNL:'Honduran Lempira',HTG:'Haitian Gourde',HUF:'Hungarian Forint',IDR:'Indonesian Rupiah',ILS:'Israeli New Shekel',INR:'Indian Rupee',IQD:'Iraqi Dinar',IRR:'Iranian Rial',ISK:'Icelandic Krona',JMD:'Jamaican Dollar',JOD:'Jordanian Dinar',JPY:'Japanese Yen',KES:'Kenyan Shilling',KGS:'Kyrgyzstani Som',KHR:'Cambodian Riel',KMF:'Comorian Franc',KRW:'South Korean Won',KWD:'Kuwaiti Dinar',KZT:'Kazakhstani Tenge',LAK:'Lao Kip',LBP:'Lebanese Pound',LKR:'Sri Lankan Rupee',LRD:'Liberian Dollar',LSL:'Lesotho Loti',LYD:'Libyan Dinar',MAD:'Moroccan Dirham',MDL:'Moldovan Leu',MGA:'Malagasy Ariary',MKD:'Macedonian Denar',MMK:'Myanmar Kyat',MNT:'Mongolian Tugrik',MOP:'Macanese Pataca',MRU:'Mauritanian Ouguiya',MUR:'Mauritian Rupee',MVR:'Maldivian Rufiyaa',MWK:'Malawian Kwacha',MXN:'Mexican Peso',MYR:'Malaysian Ringgit',MZN:'Mozambican Metical',NAD:'Namibian Dollar',NGN:'Nigerian Naira',NIO:'Nicaraguan Cordoba',NOK:'Norwegian Krone',NPR:'Nepalese Rupee',NZD:'New Zealand Dollar',OMR:'Omani Rial',PAB:'Panamanian Balboa',PEN:'Peruvian Sol',PHP:'Philippine Peso',PKR:'Pakistani Rupee',PLN:'Polish Zloty',PYG:'Paraguayan Guarani',QAR:'Qatari Riyal',RON:'Romanian Leu',RSD:'Serbian Dinar',RUB:'Russian Ruble',RWF:'Rwandan Franc',SAR:'Saudi Riyal',SBD:'Solomon Islands Dollar',SCR:'Seychellois Rupee',SDG:'Sudanese Pound',SEK:'Swedish Krona',SGD:'Singapore Dollar',SLE:'Sierra Leonean Leone',SOS:'Somali Shilling',SRD:'Surinamese Dollar',SSP:'South Sudanese Pound',STN:'Sao Tome and Principe Dobra',SYP:'Syrian Pound',SZL:'Eswatini Lilangeni',THB:'Thai Baht',TJS:'Tajikistani Somoni',TMT:'Turkmen Manat',TND:'Tunisian Dinar',TOP:'Tongan Paanga',TRY:'Turkish Lira',TTD:'Trinidad and Tobago Dollar',TWD:'New Taiwan Dollar',TZS:'Tanzanian Shilling',UAH:'Ukrainian Hryvnia',UGX:'Ugandan Shilling',USD:'US Dollar',UYU:'Uruguayan Peso',UZS:'Uzbekistani Som',VES:'Venezuelan Bolivar',VND:'Vietnamese Dong',XAF:'Central African CFA Franc',XCD:'East Caribbean Dollar',XOF:'West African CFA Franc',XPF:'CFP Franc',YER:'Yemeni Rial',ZAR:'South African Rand',ZMW:'Zambian Kwacha'};

const $=id=>document.getElementById(id);
const fromCurEl=$('fromCur'),toCurEl=$('toCur'),fromAmtEl=$('fromAmt'),toAmtEl=$('toAmt');
const rateEl=$('rate'),dot=$('dot'),statusEl=$('status');
let lastEdited='from',currentRates={},currentBase='UAH',scanActive=false;

function label(c){return `${c} — ${CURRENCY_NAMES[c]||c}`;}
function fillCurrencies(codes){
  const pf=fromCurEl.value||'UAH',pt=toCurEl.value||'SAR';
  fromCurEl.innerHTML='';toCurEl.innerHTML='';
  codes.sort().forEach(c=>{fromCurEl.add(new Option(label(c),c));toCurEl.add(new Option(label(c),c));});
  fromCurEl.value=codes.includes(pf)?pf:'UAH';
  toCurEl.value=codes.includes(pt)?pt:'SAR';
  if(fromCurEl.value===toCurEl.value) toCurEl.value=fromCurEl.value==='SAR'?'USD':'SAR';
}
async function fetchRates(base){
  const r=await fetch(`https://open.er-api.com/v6/latest/${base}`);
  const d=await r.json();
  if(!d||d.result!=='success') throw new Error();
  return d;
}
async function loadRates(base,quiet=false){
  if(!quiet) statusEl.textContent=`Fetching ${base} rates…`;
  const d=await fetchRates(base);
  currentBase=d.base_code||base;currentRates=d.rates||{};
  const codes=Object.keys(currentRates);
  if(!codes.includes(currentBase)) codes.push(currentBase);
  fillCurrencies(codes);updateRate();
  statusEl.textContent=`Rates loaded · ${currentBase}`;
}
async function ensureBase(){
  if(fromCurEl.value===currentBase){updateRate();return;}
  try{await loadRates(fromCurEl.value);}catch{statusEl.textContent='Rate refresh failed.';}
}
function updateRate(){
  const f=fromCurEl.value,t=toCurEl.value;
  if(!f||!t||f!==currentBase) return;
  rateEl.value=f===t?'1':(currentRates[t]?Number(currentRates[t]).toFixed(6):'');
  recalc();
}
function recalc(){
  const r=parseFloat(rateEl.value||0);
  if(!r){lastEdited==='from'?toAmtEl.value='':fromAmtEl.value='';return;}
  if(lastEdited==='from'){const a=parseFloat(fromAmtEl.value||0);toAmtEl.value=a?(a*r).toFixed(2):'';}
  else{const a=parseFloat(toAmtEl.value||0);fromAmtEl.value=a?(a/r).toFixed(2):'';}
}
fromAmtEl.addEventListener('input',()=>{lastEdited='from';recalc();});
toAmtEl.addEventListener('input',()=>{lastEdited='to';recalc();});
rateEl.addEventListener('input',recalc);
fromCurEl.addEventListener('change',()=>{ensureBase();window.api.setFromCurrency(fromCurEl.value);});
toCurEl.addEventListener('change',()=>{updateRate();window.api.setTargetCurrency(toCurEl.value);});
$('refreshBtn').addEventListener('click',()=>loadRates(fromCurEl.value).catch(()=>statusEl.textContent='Refresh failed.'));
$('swapBtn').addEventListener('click',async()=>{
  [fromCurEl.value,toCurEl.value]=[toCurEl.value,fromCurEl.value];
  [fromAmtEl.value,toAmtEl.value]=[toAmtEl.value,fromAmtEl.value];
  lastEdited='from';await ensureBase();
  window.api.setFromCurrency(fromCurEl.value);window.api.setTargetCurrency(toCurEl.value);
});
async function loadSources(){
  const list=await window.api.listSources();
  $('sourceSelect').innerHTML='';
  list.forEach(s=>$('sourceSelect').add(new Option(s.name,s.id)));
  statusEl.textContent=list.length?`${list.length} sources found.`:'No sources found.';
}
$('refreshSources').addEventListener('click',loadSources);
$('scanBtn').addEventListener('click',async()=>{
  if(!scanActive){
    const id=$('sourceSelect').value;
    if(!id){statusEl.textContent='Pick a source first.';return;}
    await window.api.setFromCurrency(fromCurEl.value);
    await window.api.setTargetCurrency(toCurEl.value);
    await window.api.selectSource(id);
    scanActive=true;
    $('scanBtn').textContent='■ Stop scan';$('scanBtn').classList.add('active');
    dot.className='scanning';statusEl.textContent='OCR scanning…';
  } else {
    await window.api.stopScan();
    scanActive=false;
    $('scanBtn').textContent='▶ Start scan';$('scanBtn').classList.remove('active');
    dot.className='';statusEl.textContent='Scan stopped.';
  }
});
window.api.onScanState(({scanning,count,error})=>{
  if(error){dot.className='error';statusEl.textContent='OCR error.';return;}
  dot.className=scanning?'scanning':'';
  if(scanning) statusEl.textContent=count?`OCR active · ${count} price(s) found`:'OCR active · scanning…';
});
$('lockBtn').addEventListener('click',async()=>{
  const locked=await window.api.toggleLock();
  $('lockBtn').textContent=locked?'🔒 Unlock overlay':'🔓 Lock overlay';
  $('lockBtn').className=locked?'locked':'';
  statusEl.textContent=locked?'Locked · Ctrl+Shift+L to unlock':'Unlocked';
});
window.api.onLock(locked=>{
  $('lockBtn').textContent=locked?'🔒 Unlock overlay':'🔓 Lock overlay';
  $('lockBtn').className=locked?'locked':'';
});
$('minBtn').addEventListener('click',()=>window.api.minimize());
$('closeBtn').addEventListener('click',()=>window.api.close());
window.addEventListener('DOMContentLoaded',async()=>{
  try{
    await loadRates('UAH',true);
    await loadSources();
    const locked=await window.api.getLock();
    $('lockBtn').textContent=locked?'🔒 Unlock overlay':'🔓 Lock overlay';
    $('lockBtn').className=locked?'locked':'';
  }catch{ statusEl.textContent='Startup failed — check internet.'; }
});
</script>
</body>
</html>
